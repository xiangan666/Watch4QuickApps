plugins {
    id 'com.android.application'
}
def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }
android {
    namespace 'com.xiangan.watch4manager'
    compileSdk 36
    defaultConfig {
        applicationId 'com.xiangan.watch4manager'
        minSdk 26
        targetSdk 36
        versionCode appVersion.versionCode.toInteger()
        versionName appVersion.versionName
        testInstrumentationRunner 'com.xiangan.watch4manager.ManagerSmokeTest'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
dependencies {
    implementation project(':protocol')
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.annotation:annotation:1.3.0'
}
